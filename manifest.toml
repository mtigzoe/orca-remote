[extension]
name = "remote"
display-name = "Orca Remote"
version = "0.9.7"
author = "SerrebiDev and contributors"
license = "LGPL-2.1-or-later"
url = "https://github.com/serrebidev/orca-remote"
description = """
NVDA-Remote-compatible remote access for Orca. Bidirectional
speech and braille mirroring across an NVDA Remote v2.x relay:
act as a client (receive remote speech) or as a host (broadcast
our speech). Master-side key forwarding with full system-level
consume (KeysetGrab) so forwarded keys only act on the remote
machine. Orca Remote command chords stay local while forwarding.
"""

[compatibility]
# Released Orca (51.1) loads this package and mirrors speech; its
# controller has no subscribe_* hooks, so key forwarding, braille
# mirroring, and inbound braille rendering need a build that has
# them (the perf branch this project is tested on, or a later
# upstream). Install on released Orca with ./install-extension;
# the manifest/--install-extension path is newer-Orca only.
min-orca = "51.1"
last-tested-orca = "51.alpha (perf branch)"

[entry]
module = "remote"
class = "RemoteExtension"
